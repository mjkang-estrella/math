<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Machina Mathematica</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<style>
  /* Light theme only, on purpose: a printed-journal look. */
  :root {
    color-scheme: light;
    --ink: #1c1c1c;
    --muted: #6b6b6b;
    --faint: #9a9a9a;
    --accent: #8b1a1a;       /* dark red, as in hyperref's classic links */
    --rule: #d9d5cc;
    --bg: #fdfcf9;
    --panel: #f6f4ee;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: Georgia, "Times New Roman", "STIX Two Text", serif;
    font-size: 17px; line-height: 1.55;
  }
  .page { max-width: 880px; margin: 0 auto; padding: 3.2rem 1.4rem 4rem; }
  button { background: none; border: 0; padding: 0; cursor: pointer; font: inherit;
           color: inherit; text-align: left; }

  header h1 { font-size: 2.1rem; font-weight: normal; margin: 0 0 .4rem; letter-spacing: .01em; }
  header .sub { color: var(--muted); margin: 0; max-width: 62ch; }
  header .totals { margin: .9rem 0 0; }
  hr.rule { border: 0; border-top: 1px solid var(--rule); margin: 1.6rem 0; }

  /* arXiv categories: a table of contents with dotted leaders. Click to filter. */
  .toc { margin: 0; padding: 0; list-style: none; }
  .toc button { display: flex; align-items: baseline; gap: .5rem; width: 100%; padding: .16rem 0; }
  .toc .dots { flex: 1; border-bottom: 1px dotted var(--faint); transform: translateY(-4px); }
  .toc .n { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .toc .code { font-family: "Courier New", monospace; font-size: .86rem; }
  .toc .cname { }
  .toc button:hover .name .cname, .toc button:hover .name .axtag { color: var(--accent); }
  .toc li.active .name .cname { color: var(--accent); font-style: italic; }

  .controls { margin: 1.1rem 0 0; color: var(--muted); }
  .controls button { color: var(--accent); }
  .controls button:hover { font-style: italic; }

  h2.section {
    font-size: 1.05rem; font-weight: normal; letter-spacing: .16em;
    text-transform: uppercase; color: var(--muted);
    margin: 2.4rem 0 .4rem; border-bottom: 1px solid var(--rule); padding-bottom: .3rem;
  }

  /* One entry layout for papers and work in progress alike: an arXiv-style
     identifier line above the title, one click opens everything. */
  .entry { border-bottom: 1px solid var(--rule); padding: .65rem 0 .7rem; }
  .entry .head { cursor: pointer; }
  .idline { margin: 0; font-size: .82rem; color: var(--faint); }
  .idline .slug { font-family: "Courier New", monospace; color: var(--muted); }
  .idline a { color: var(--accent); text-decoration: none; }
  .idline a:hover { font-style: italic; }
  .axtag { font-family: "Courier New", monospace; font-size: .74rem; border: 1px solid var(--faint); border-radius: 9px; padding: 0 .45em; color: var(--muted); white-space: nowrap; }
  /* Secondary chip: the subject subtag, scoped to the arXiv class beside it. */
  .toptag { font-size: .74rem; border: 1px solid var(--rule); border-radius: 9px;
    padding: 0 .45em; color: var(--faint); white-space: nowrap; }
  .etitle { margin: .06rem 0 0; font-size: 1.08rem; }
  .entry .head:hover .etitle { color: var(--accent); }
  .panel { display: none; background: var(--panel); border-radius: 4px;
    padding: .85rem 1.05rem; margin-top: .55rem; }
  .entry.open .panel { display: block; }
  .abshead { font-variant: small-caps; letter-spacing: .06em;
    color: var(--muted); margin-right: .4rem; }
  .meta { color: var(--muted); font-size: .88rem; margin: .6rem 0 .2rem; }

  /* Statement rows: deliberately quiet. */
  table.rows { border-collapse: collapse; width: 100%; font-size: .85rem; }
  table.rows td { border-top: 1px solid var(--rule); padding: .28rem .55rem .28rem 0;
    vertical-align: baseline; color: var(--muted); }
  table.rows td.rid { white-space: nowrap; font-family: "Courier New", monospace;
    font-size: .8rem; color: var(--faint); }
  table.rows td.grade { white-space: nowrap; font-variant: small-caps;
    letter-spacing: .04em; color: var(--faint); }
  table.rows td.lbl { color: var(--ink); width: 100%; }

  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--faint);
    border-top-color: var(--accent); border-radius: 50%; animation: sp 0.8s linear infinite;
    vertical-align: -2px; margin-right: .5em; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .wiptag { font-size: .74rem; border: 1px dashed var(--faint); border-radius: 9px;
    padding: 0 .45em; color: var(--muted); white-space: nowrap; }
  footer { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--faint); }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>Machina Mathematica</h1>
    <p class="sub">Open problems of mathematics, found and settled by an autonomous AI research loop, pinned in Lean.
      Each family gets its own paper. Every stated result is machine-checked
      in Lean&nbsp;4 with Mathlib. <a href="/analysis">analysis&nbsp;&rarr;</a></p>
    <p class="totals" id="totals"><span class="spin"></span>loading the dossier…</p>
  </header>
  <hr class="rule">
  <ul class="toc" id="toc"></ul>
  <p class="controls" id="controls"></p>
  <div id="papers"></div>
  <div id="wip"></div>
  <footer id="foot"></footer>
</div>
<script src="/arxiv-categories.js"></script>
<script>
"use strict";
/* state.cat holds an arXiv primary category code, or "unlisted", or null (all). */
const state = { cat: null };
let DATA = null;

const catOf = f => f.arxiv || UNLISTED;
const catName = c => CAT_NAMES[c] || "";

const esc = s => String(s ?? "").replace(/[&<>"]/g,
  c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
/* Statement labels use light markdown; render `code` as math-ish italic. */
const prose = s => esc(s)
  .replace(/`([^`]+)`/g, '<span class="m">$1</span>')
  .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
/* Text-mode LaTeX conventions, leaving $...$ segments intact for KaTeX. */
const latexText = s => esc(s)
  .replace(/\\\\/g, " ").replace(/---/g, "—").replace(/--/g, "–")
  .replace(/``/g, "“").replace(/''/g, "”").replace(/~/g, " ")
  .replace(/\\emph\{([^{}]*)\}/g, "<i>$1</i>");

/* Typeset $...$ / \[...\] inside el once KaTeX is loaded; macros come from the paper. */
function typeset(el, macros) {
  const go = () => window.renderMathInElement && renderMathInElement(el, {
    delimiters: [
      { left: "$$", right: "$$", display: true },
      { left: "\\[", right: "\\]", display: true },
      { left: "$", right: "$", display: false },
      { left: "\\(", right: "\\)", display: false }],
    macros: Object.assign({}, macros), throwOnError: false });
  if (window.renderMathInElement) go();
  else window.addEventListener("DOMContentLoaded", go);
}

const hasPaper = f => (f.paper || 0) >= 1;
const gradeLabel = g => (g || "").toLowerCase().replace("known-data", "known data");
const famsOf = c => DATA.families.filter(f => catOf(f) === c);

/* Categories present, most families first; "unlisted" always last. Ties break
   on the code so the order is stable between renders. */
function catList() {
  const n = new Map();
  for (const f of DATA.families) {
    const c = catOf(f);
    n.set(c, (n.get(c) || 0) + 1);
  }
  return [...n.keys()].sort((a, b) =>
    (a === UNLISTED) - (b === UNLISTED) || n.get(b) - n.get(a) || a.localeCompare(b));
}

const rowsHtml = f =>
  `<table class="rows">` + f.statements.map(s =>
    `<tr><td class="rid">${esc(s.id)}</td>` +
    `<td class="grade">${esc(gradeLabel(s.novelty))}${s.unbound ? " ·" : ""}</td>` +
    `<td class="lbl">${prose(s.label)}</td></tr>`).join("") + `</table>`;

/* Same layout for papers and work in progress: identifier line, title, panel. */
function entryEl(f) {
  const div = document.createElement("div");
  div.className = "entry";
  const head = document.createElement("div");
  head.className = "head";
  const bits = [`<span class="slug">${esc(f.slug)}</span>`];
  if (f.arxiv) bits.push(`<span class="axtag" title="arXiv primary category` +
    `${catName(f.arxiv) ? " — " + esc(catName(f.arxiv)) : ""}">${esc(f.arxiv)}</span>`);
  /* Subtags are scoped to the arXiv class and mean nothing outside it; a class
     may define none, and then the family carries no chip at all. */
  const topic = f.topic && ((DATA.areas[f.arxiv] || {})[f.topic] || f.topic);
  if (topic) bits.push(`<span class="toptag" title="topic within ` +
    `${esc(f.arxiv || "no arXiv category")}">topic: ${esc(topic)}</span>`);
  if (hasPaper(f)) {
    bits.push(`v${f.paper}`);
    if (f.pdf) bits.push(`<a href="/papers/${f.pdf}">pdf</a>`);
  } else {
    bits.push(`<span class="wiptag">work in progress</span>`);
    if (f.paper === 0) bits.push("draft in preparation");
  }
  head.innerHTML = `<p class="idline">${bits.join(" · ")}</p>` +
    `<p class="etitle">${hasPaper(f) ? latexText(f.paper_title || f.title) : esc(f.title)}</p>`;
  head.onclick = e => { if (e.target.tagName !== "A") div.classList.toggle("open"); };

  const panel = document.createElement("div");
  panel.className = "panel";
  panel.innerHTML =
    (hasPaper(f) && f.paper_abstract
      ? `<p style="margin:0"><span class="abshead">Abstract.</span>${latexText(f.paper_abstract)}</p>`
      : "") +
    `<p class="meta"${hasPaper(f) ? "" : ' style="margin-top:0"'}>` +
    `${f.theorems.toLocaleString("en-US")} machine-checked theorems · ` +
    `${f.statements.length} statements</p>` + rowsHtml(f);
  div.append(head, panel);
  if (hasPaper(f)) typeset(div, f.paper_macros || {});
  return div;
}

function render() {
  document.getElementById("totals").textContent = "";
  const t = DATA.totals;
  document.getElementById("totals").textContent =
    `${t.papers} papers · ${t.families - t.papers} families in progress`;

  const cats = catList();
  const toc = document.getElementById("toc");
  toc.innerHTML = "";
  for (const c of cats) {
    const fs = famsOf(c);
    const p = fs.filter(hasPaper).length, w = fs.length - p;
    const li = document.createElement("li");
    if (state.cat === c) li.className = "active";
    const b = document.createElement("button");
    const parts = [p ? `${p} paper${p > 1 ? "s" : ""}` : "", w ? `${w} in progress` : ""]
      .filter(Boolean).join(" · ");
    const nm = catName(c);
    b.innerHTML = `<span class="name">${nm ? `<span class="cname">${esc(nm)}</span> ` : ""}` +
      `<span class="axtag">${esc(c)}</span></span>` +
      `<span class="dots"></span><span class="n">${parts}</span>`;
    b.onclick = () => { state.cat = state.cat === c ? null : c; render(); };
    li.appendChild(b); toc.appendChild(li);
  }

  const c = document.getElementById("controls");
  c.innerHTML = "";
  if (state.cat) {
    const clr = document.createElement("button");
    const nm = catName(state.cat);
    clr.textContent = `all categories (showing ${nm || state.cat})`;
    clr.onclick = () => { state.cat = null; render(); };
    c.append(" · ", clr);
  }

  // Papers first, front and centre.
  const papers = DATA.families.filter(hasPaper)
    .filter(f => !state.cat || catOf(f) === state.cat)
    .sort((a, b) => (a.paper_title || a.title).localeCompare(b.paper_title || b.title));
  const P = document.getElementById("papers");
  P.innerHTML = papers.length ? `<h2 class="section">Papers</h2>` : "";
  papers.forEach(f => P.appendChild(entryEl(f)));

  // Then the rest, one flat list in the same order as the table of contents
  // (the category is on the idline).
  const rank = new Map(cats.map((c, i) => [c, i]));
  const W = document.getElementById("wip");
  W.innerHTML = "";
  {
    const fs = DATA.families.filter(f => !hasPaper(f))
      .filter(f => !state.cat || catOf(f) === state.cat)
      .sort((a, b) => rank.get(catOf(a)) - rank.get(catOf(b)) ||
        a.title.localeCompare(b.title));
    if (fs.length) {
      W.innerHTML = `<h2 class="section">Work in progress</h2>`;
      fs.forEach(f => W.appendChild(entryEl(f)));
    }
  }

  document.getElementById("foot").textContent =
    `${DATA.totals.theorems.toLocaleString("en-US")} machine-checked theorems in total · ` +
    `snapshot of ${DATA.generated_at} · ${DATA.commit}`;
}

/* Researcher-derived tracks (family.json derived_from) are listed here like
   every other family; /r/<slug> (unlinked) shows one researcher's subset. */
fetch("/api/data").then(r => r.json()).then(j => { DATA = j; render(); })
  .catch(() => { document.getElementById("totals").textContent = "snapshot not available"; });

</script>
</body>
</html>
